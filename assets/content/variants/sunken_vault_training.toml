# Example variant: a gentle training version of The Sunken Vault.
#
# Shows how to make an encounter easier for learning mechanics:
#   * Enemy HP x0.6 and damage x0.7.
#   * Morvane's phase 2 starts at 70% and rings come slowly with long warnings.
#   * Only two trash packs; the reliquary pack is optional.

[dungeon]
id = "sunken_vault_training"
name = "The Sunken Vault (Training)"
description = "Variant: weaker enemies, long ring warnings, optional third pack."
recommended_level = 1
hp_multiplier = 0.6
damage_multiplier = 0.7
entrance = [0.0, 0.0]
leash_radius = 45.0

[[dungeon.areas]]
name = "Flooded Antechamber"
min = [-8.0, -6.0]
max = [8.0, 10.0]

[[dungeon.areas]]
name = "Drowned Stair"
min = [-3.0, 8.0]
max = [3.0, 30.0]

[[dungeon.areas]]
name = "Hall of Sluices"
min = [-12.0, 28.0]
max = [12.0, 48.0]

[[dungeon.areas]]
name = "East Culvert"
min = [10.0, 35.0]
max = [36.0, 41.0]

[[dungeon.areas]]
name = "Brute's Cistern"
min = [34.0, 26.0]
max = [56.0, 50.0]

[[dungeon.areas]]
name = "North Culvert"
min = [42.0, 48.0]
max = [48.0, 72.0]

[[dungeon.areas]]
name = "Reliquary"
min = [34.0, 70.0]
max = [56.0, 88.0]

[[dungeon.areas]]
name = "Throne Approach"
min = [42.0, 86.0]
max = [48.0, 100.0]

[[dungeon.areas]]
name = "Hollow Throne"
min = [28.0, 98.0]
max = [62.0, 128.0]

[templates.skulker]
name = "Gloomfang Skulker"
rank = "trash"
hp = 600.0
melee_damage = 26.0
attack_interval = 2.0
aggro_radius = 10.0
speed = 6.5
radius = 0.6

[templates.hollow_king]
name = "Morvane, the Hollow King"
rank = "boss"
level = 2
hp = 14000.0
melee_damage = 150.0
attack_interval = 2.0
attack_range = 2.5
aggro_radius = 14.0
speed = 6.5
radius = 1.6

[[templates.hollow_king.phases]]
hp_below = 0.7
announce = "Morvane begins to smoulder. Rings will appear - step out!"

[[templates.hollow_king.abilities]]
name = "Cinder Ring"
kind = "ring"
interval = 12.0
initial = 3.0
delay = 4.0
radius = 5.0
damage = 300.0
school = "fire"
target = "random"
phases = [2]

[[encounters]]
id = "sluice_pack"
mobs = [
  { template = "skulker", pos = [-4.0, 40.0] },
  { template = "skulker", pos = [4.0, 40.0] },
]

[[encounters]]
id = "reliquary_pack"
optional = true
mobs = [
  { template = "skulker", pos = [44.0, 82.0] },
  { template = "skulker", pos = [48.0, 82.0] },
]

[[encounters]]
id = "hollow_king"
mobs = [
  { template = "hollow_king", pos = [45.0, 116.0] },
]

[[loot]]
id = "training_badge"
name = "Novice's Badge"
slot = "trinket"
stats = { stamina = 5 }
weight = 1

[rewards]
marks_per_clear = 3
xp_per_clear = 150
