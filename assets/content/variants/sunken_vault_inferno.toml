min = [-12.0, 28.0]
max = [12.0, 48.0]

[[dungeon.areas]]
name = "East Culvert"
min = [10.0, 35.0]
max = [36.0, 41.0]

[[dungeon.areas]]
name = "Brute's Cistern"
min = [34.0, 26.0]
max = [56.0, 50.0]

[[dungeon.areas]]
name = "North Culvert"
