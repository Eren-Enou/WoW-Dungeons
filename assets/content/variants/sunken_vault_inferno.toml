# Example variant of The Sunken Vault demonstrating the sandbox knobs.
#
# Changes vs. the shipped file:
#   * dungeon.id/name changed so it can sit next to the original.
#   * Enemy HP x1.4, damage x1.2.
#   * Morvane gains a third phase at 25% that summons two skulkers.
#   * Cinder Ring fires every 5 s with TWO rings and only 1.8 s of warning.
#   * Phase 1 adds a frontal "Hollow Sweep" cleave.
#   * The throne room gets two flame vents (environmental hazard).
#
# Try it:
#   cargo run --release -p dungeon_sim --bin dungeon-headless -- --content assets/content/variants/sunken_vault_inferno.toml --runs 20
# or copy it into assets/content/dungeons/ and press F5 in the hub.

[dungeon]
id = "sunken_vault_inferno"
name = "The Sunken Vault (Inferno)"
description = "Variant: faster, double Cinder Rings, a third phase with adds and flame vents."
recommended_level = 2
hp_multiplier = 1.4
damage_multiplier = 1.2
entrance = [0.0, 0.0]
leash_radius = 45.0
theme = { floor = [0.26, 0.18, 0.16], wall = [0.36, 0.22, 0.20], light = [1.0, 0.55, 0.3] }

[[dungeon.areas]]
name = "Flooded Antechamber"
min = [-8.0, -6.0]
max = [8.0, 10.0]

[[dungeon.areas]]
name = "Drowned Stair"
min = [-3.0, 8.0]
max = [3.0, 30.0]

[[dungeon.areas]]
