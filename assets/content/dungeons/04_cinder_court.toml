# Dungeon Sandbox content file: The Cinder Court (10-player raid, level 10).
#
# Built for a 10-person raid group (Party tab -> Raid (10)): two tanks, two
# healers, six damage dealers. Encounter design goals:
#   * Twinmaw stacks Sundering Bite (+20% damage taken per stack, no dispel) on
#     its tank. Tanks must SWAP at 3 stacks: the fresh tank taunts and the
#     stacked tank stops attacking until the stacks fall off.
#   * Searing Breath is a wide frontal cone; Earthshake hits the whole raid.
#   * The Cinder Regent rains rings on many players at once, calls Court Embers,
#     brands healers' targets with reduced healing, then stacks Regent's Brand on
#     the tank (another swap) while the rings intensify.

[dungeon]
id = "cinder_court"
name = "The Cinder Court"
description = "RAID (10 players). The fire cult's throne room: gate guards, Twinmaw the Behemoth (tank swaps) and the Cinder Regent."
recommended_level = 10
recommended_group = 10
hp_multiplier = 1.0
damage_multiplier = 1.0
entrance = [0.0, 0.0]
leash_radius = 60.0
theme = { floor = [0.22, 0.17, 0.17], wall = [0.32, 0.20, 0.18], light = [1.0, 0.45, 0.25] }

[[difficulties]]
id = "normal"
name = "Normal"

[[difficulties]]
