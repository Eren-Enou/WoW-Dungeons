# Dungeon Sandbox content file: The Gloomroot Warrens (levels 4-6).
#
# A second, harder dungeon built with the same schema as the Sunken Vault.
# Encounter design goals (see PROGRESS.md):
#   * Rootweaver Shamans heal their allies - interrupt or kill them first.
#   * Gloom Hexers cast Shadow Volley on the whole party - interrupt them.
#   * Mother Brakkis summons spiderlings (switch targets) and stacks a dispellable
#     poison on the tank; her mandibles cleave in front - stand behind her.
#   * The Ember Pools have lava vents that pulse on and off.
#   * Vhorlag has three phases: a party-wide pulse that calls for defensive
#     cooldowns, rootling adds, double thorn rings, then a stacking tank debuff.
#   * The Sporecap Grotto is optional.

[dungeon]
id = "gloomroot_warrens"
name = "The Gloomroot Warrens"
description = "Fungal tunnels under the old forest. Healer-casters, a brood mother, lava vents and Vhorlag, the Rootbound King."
recommended_level = 4
hp_multiplier = 1.0
damage_multiplier = 1.0
entrance = [0.0, 0.0]
leash_radius = 50.0
theme = { floor = [0.18, 0.22, 0.16], wall = [0.26, 0.24, 0.20], light = [0.65, 1.0, 0.55] }

[[difficulties]]
