# Dungeon Sandbox content file: The Ashen Spire (levels 8-10).
#
# The endgame dungeon. Encounter design goals:
#   * Ember Acolytes heal allies and brand the party with Searing Mark
#     (-25% healing received) - interrupt the heals, Purify the marks.
#   * Obsidian Sentinels: heavy armor and a frontal sweep.
#   * The Fire Walk is a corridor of timed flame jets.
#   * The Twin Altar is a council: Ignis (interruptible Flame Wave on the whole
#     party) and Cindra (Cinder Lance on whoever stands farthest, stacking
#     Kindling on her target). Both must die; interrupt both.
#   * Ashmaw has three phases: frontal maw + lances, then ashling adds and
#     healing-reduction brands with triple eruptions, then Cataclysm pulses.
#   * The Furnace is optional.

[dungeon]
id = "ashen_spire"
name = "The Ashen Spire"
description = "A smouldering tower of the old fire cult. Acolytes, obsidian sentinels, the Twin Altar council and Ashmaw, the Sovereign of Cinders."
recommended_level = 8
hp_multiplier = 1.0
damage_multiplier = 1.0
entrance = [0.0, 0.0]
leash_radius = 55.0
theme = { floor = [0.26, 0.20, 0.18], wall = [0.30, 0.22, 0.20], light = [1.0, 0.55, 0.30] }

