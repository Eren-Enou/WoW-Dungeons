# Dungeon Sandbox content file: Cavern Traverse (navigation test dungeon, 0.4).
#
# A short graybox cave built to exercise the layered navigation: a winding
# passage, a fork with a dead end, a ramp up to a high walkway, a bridge over a
# lower passage, a gallery stacked above that passage (two routes on top of
# each other), a one-way drop, a lava pit to walk around, a narrow tunnel, a
# fire vent and a boss basin below the entrance level.
#
# Coordinates are [x, z] on the ground plane; `y` is height in metres. Areas at
# the same height that overlap are connected; areas at different heights only
# connect through ramps (`y_to`) or authored drops (`[[dungeon.links]]`).
# See RULES.md ("Navigation") for every field.

[dungeon]
id = "cavern_traverse"
name = "Cavern Traverse"
description = "A navigation proving ground: winding tunnels, a high walkway and rope bridge, a stacked gallery, a one-way drop and the Magma Basin below."
recommended_level = 2
hp_multiplier = 1.0
damage_multiplier = 1.0
entrance = [0.0, -4.0]
leash_radius = 45.0
theme = { floor = [0.25, 0.21, 0.19], wall = [0.36, 0.30, 0.27], light = [1.0, 0.6, 0.35] }

[[difficulties]]
id = "normal"
name = "Normal"

[[difficulties]]
id = "heroic"
name = "Heroic"
hp = 1.6
damage = 1.4
level_bonus = 2
reward_multiplier = 2.0
rarity_bonus = 1

[[difficulties]]
id = "raid10"
name = "Raid (10)"
hp = 2.6
damage = 1.6
level_bonus = 1
reward_multiplier = 1.5
rarity_bonus = 1

# ------------------------------------------------------------------ layout --

# 1. Entrance cavern.
[[dungeon.areas]]
name = "Entrance Cavern"
min = [-10.0, -8.0]
max = [10.0, 10.0]

# 2. Winding passage (three legs).
[[dungeon.areas]]
name = "Winding Passage 1"
min = [-2.0, 8.0]
max = [2.0, 24.0]

[[dungeon.areas]]
name = "Winding Passage 2"
min = [-2.0, 20.0]
max = [18.0, 24.0]

[[dungeon.areas]]
name = "Winding Passage 3"
min = [14.0, 20.0]
max = [18.0, 36.0]

# Branching intersection.
[[dungeon.areas]]
name = "Fork Hall"
min = [8.0, 34.0]
max = [28.0, 48.0]

# Dead end.
[[dungeon.areas]]
name = "Dead-End Alcove"
min = [-4.0, 38.0]
max = [10.0, 44.0]

# 3. Ramp up to the elevated walkway (rises 5 m over 14 m).
[[dungeon.areas]]
name = "Ash Ramp"
min = [14.0, 47.0]
max = [20.0, 61.0]
y = 0.0
y_to = 5.0

[[dungeon.areas]]
name = "High Walkway"
min = [14.0, 60.0]
max = [20.0, 76.0]
y = 5.0

# 4. Rope bridge crossing above the underpass.
[[dungeon.areas]]
name = "Rope Bridge"
min = [19.0, 68.0]
max = [47.0, 72.0]
y = 5.0
under = "open"
walls = false

[[dungeon.areas]]
name = "East Ledge"
min = [46.0, 64.0]
max = [56.0, 82.0]
y = 5.0

# 5. Hanging gallery: runs directly above the underpass (two stacked routes)
# and ends at the drop into the basin.
[[dungeon.areas]]
name = "Hanging Gallery"
min = [39.0, 78.0]
max = [47.0, 98.0]
y = 5.0
under = "open"
walls = false

# 8. Narrow tunnel (3 m) east from the fork.
[[dungeon.areas]]
name = "Narrow Tunnel"
min = [26.0, 40.0]
max = [44.0, 43.0]

# 7. Lava hollow: a ring of floor around a lava pit - two ways round.
[[dungeon.areas]]
name = "Lava Hollow South"
min = [40.0, 40.0]
max = [54.0, 46.0]

[[dungeon.areas]]
name = "Lava Hollow West"
min = [40.0, 40.0]
max = [44.0, 58.0]

[[dungeon.areas]]
name = "Lava Hollow East"
min = [48.0, 40.0]
max = [54.0, 58.0]

[[dungeon.areas]]
name = "Lava Hollow North"
min = [40.0, 52.0]
max = [54.0, 58.0]

# The lower passage beneath the bridge and the gallery.
[[dungeon.areas]]
name = "Underpass"
min = [40.0, 56.0]
max = [44.0, 90.5]

# Stairs down into the basin (0 m to -3 m).
[[dungeon.areas]]
name = "Cinder Descent"
min = [40.0, 89.0]
max = [44.0, 99.5]
y = 0.0
y_to = -3.0
stairs = true

# 10. Boss arena, 3 m below the entrance.
[[dungeon.areas]]
name = "Magma Basin"
min = [26.0, 98.0]
max = [60.0, 126.0]
y = -3.0

# An unreachable rock perch beside the basin (pathfinding must give up cleanly).
[[dungeon.areas]]
name = "Sniper Perch"
min = [60.0, 108.0]
max = [64.0, 112.0]
y = 3.0
unreachable = true

# 6. One-way drop: step off the end of the gallery, fall 8 m into the basin.
[[dungeon.links]]
from = "Hanging Gallery"
to = "Magma Basin"
kind = "drop"
min = [40.0, 96.5]
max = [46.0, 99.5]

# 9. Environmental hazard: the lava pit (decor) and a fire vent (below).
[[dungeon.lava]]
min = [44.0, 46.0]
max = [48.0, 52.0]
y = -0.6

[[dungeon.lava]]
min = [27.0, 118.0]
max = [33.0, 125.0]
y = -3.4

