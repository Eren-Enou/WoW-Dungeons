# Dungeon Sandbox content file: The Cinderdeep Hollows (levels 5-7).
#
# An original lava-cavern descent. The Scaldkin, a tribe of fire-worshipping
# salamander-folk, have dug down to the molten heart of the mountain. Go down
# through the cold Frostvent Gate, choose the low Ashgrub Run or the high
# Ridge Path, break the Kilnmaster in his Smelter Gallery, cross the Kiln
# Span over the lava river, fight across the Magma Cistern and face Ignarax,
# the Molten Heart, on its island.
#
# Walkable areas are convex polygons (`points`) with heights (`y`, ramps via
# `y_to` + `slope_from`/`slope_to`). Areas connect only where they overlap and
# are level with each other. See RULES.md ("Navigation") and DUNGEON_0_5.md.

[dungeon]
id = "cinderdeep_hollows"
name = "The Cinderdeep Hollows"
description = "An original lava-cavern descent: winding tunnels, a choice of high or low road, the Kiln Span over a lava river, the Magma Cistern and Ignarax, the Molten Heart."
recommended_level = 5
hp_multiplier = 1.0
damage_multiplier = 1.0
entrance = [0.0, -8.0]
leash_radius = 55.0
theme = { floor = [0.24, 0.21, 0.19], wall = [0.30, 0.25, 0.23], light = [1.0, 0.6, 0.35], fog = [0.07, 0.04, 0.04], ambient = [0.55, 0.45, 0.42], rough_walls = true }

[[difficulties]]
id = "normal"
name = "Normal"

[[difficulties]]
id = "heroic"
name = "Heroic"
hp = 1.5
damage = 1.35
level_bonus = 2
reward_multiplier = 2.0
rarity_bonus = 1

[[difficulties]]
id = "raid10"
name = "Raid (10)"
hp = 2.6
damage = 1.6
level_bonus = 1
reward_multiplier = 1.5
rarity_bonus = 1

