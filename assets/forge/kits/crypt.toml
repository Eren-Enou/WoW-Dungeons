# ------------------------------------------------------------ presentation --
# 0.8: dressed-stone modular art along the real walls (original GLBs from
# scripts/make_prop_models.py; plain slabs where a file is missing). Pillars
# are drawn as solid columns exactly the size of their holes in the floor,
# because they are cover. Cold air, warm candles.

[modules]
wall = { model = "models/kit/crypt_wall.glb", size = [4.0, 4.5, 0.7], variants = ["models/kit/crypt_wall_niche.glb"], variant_chance = 0.2 }
corner = { model = "models/kit/crypt_corner.glb", size = [0.9, 4.8, 0.9] }
door = { model = "models/kit/crypt_arch.glb", size = [4.0, 5.2, 0.8] }
pillar = { model = "models/kit/crypt_pillar.glb", size = [1.0, 7.0, 1.0] }

[atmosphere.default]
ambient = [0.32, 0.37, 0.42]
fog = [0.025, 0.035, 0.045]

[atmosphere.entrance]
ambient = [0.36, 0.4, 0.48]
brightness = 240.0
fog = [0.03, 0.04, 0.055]
fog_start = 20.0
fog_end = 80.0

[atmosphere.corridor]   # narrow passages: dark and close
ambient = [0.26, 0.3, 0.36]
brightness = 160.0
fog = [0.02, 0.025, 0.035]
fog_start = 10.0
fog_end = 48.0

[atmosphere.passage]
ambient = [0.26, 0.3, 0.36]
brightness = 160.0
fog = [0.02, 0.025, 0.035]
fog_start = 10.0
fog_end = 48.0

[atmosphere.stair]
ambient = [0.24, 0.28, 0.34]
brightness = 150.0
fog = [0.02, 0.025, 0.035]
fog_start = 10.0
fog_end = 45.0

[atmosphere.hall]       # naves: cold, long views
ambient = [0.32, 0.36, 0.42]
brightness = 210.0
fog = [0.025, 0.033, 0.045]
fog_start = 16.0
fog_end = 70.0

[atmosphere.side]       # burial cells: warmer, candle-lit
ambient = [0.42, 0.36, 0.3]
brightness = 190.0
fog = [0.04, 0.03, 0.025]
fog_start = 10.0
fog_end = 45.0

[atmosphere.vault]      # sealed treasuries: candle gold
ambient = [0.5, 0.42, 0.3]
brightness = 210.0
fog = [0.045, 0.035, 0.02]
fog_start = 8.0
fog_end = 40.0

[atmosphere.vista]      # the mourner's chapel: pale grave-light
ambient = [0.3, 0.45, 0.44]
brightness = 240.0
fog = [0.02, 0.05, 0.05]
fog_start = 10.0
fog_end = 55.0

[atmosphere.chamber]
