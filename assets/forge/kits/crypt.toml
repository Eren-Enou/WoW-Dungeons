# Doorways off the main route say "something is through here" without
# saying what: teal grave-light tablets where a branch holds a reward ...
[[decorate]]
anchor = "branch_door"
branches = ["detour", "optional", "cache"]
prop = { model = "models/kit/crypt_plaque.glb", fallback = "crystal", radius = 0.5, height = 1.0 }
light = { color = [0.35, 1.0, 0.85], intensity = 0.4, range = 8.0, height = 0.0, every = 1 }

# ... warm double candles at the way to a landmark ...
[[decorate]]
anchor = "branch_door"
branches = ["vista"]
prop = { model = "models/kit/crypt_sconce.glb", fallback = "crystal", radius = 0.5, height = 0.7 }
light = { color = [1.0, 0.8, 0.5], intensity = 0.6, range = 9.0, height = 0.3, every = 1 }

# ... and a single guttering candle at a narrow side passage (a flank).
[[decorate]]
anchor = "branch_door"
branches = ["flank", "safe", "loop", "quiet"]
every = 2
prop = { model = "models/kit/crypt_sconce.glb", fallback = "crystal", radius = 0.5, height = 0.7 }
light = { color = [1.0, 0.6, 0.3], intensity = 0.15, range = 5.0, height = 0.3, every = 1 }

# The mourner effigy on a landmark chapel's plinth.
[[decorate]]
anchor = "plinth"
rooms = ["vista"]
prop = { model = "models/props/crypt_effigy.glb", fallback = "pillar", radius = 1.1, height = 3.5 }
light = { color = [0.35, 1.0, 0.85], intensity = 0.8, range = 12.0, height = 1.2, every = 1 }
