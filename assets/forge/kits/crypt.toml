# Dungeon Forge kit: Crypt (original).
#
# The buried monastery of the Hushed, an order that swore silence and kept it
# past death. Cold stone, narrow passages, long pillared naves where pillars
# are solid (they block movement and line of sight), sealed burial cells, and
# a guardian beneath it all whose wail only cover can stop.
#
# Compared with the volcanic kit this changes the *space* (tight grid,
# rectangular naves, pillars, narrow corridors, no lava) and the *fights*
# (defensive screens, line-of-sight pulls, a patrol, a council of two abbots,
# a boss you hide from), not only the colours.

[kit]
id = "crypt"
name = "Crypt"
reference_level = 5

[palette]
theme = { floor = [0.30, 0.30, 0.29], wall = [0.40, 0.39, 0.37], light = [0.75, 0.85, 1.0], fog = [0.025, 0.035, 0.045], ambient = [0.32, 0.37, 0.42], rough_walls = false }
tint_shallow = [0.33, 0.33, 0.32]
tint_deep = [0.25, 0.28, 0.29]
light_shallow = [0.55, 0.68, 0.95]
light_deep = [0.45, 0.85, 0.72]
light_intensity = 0.75
decor = ["pillar"]

[palette.names]
entrance = ["Sealed Gate", "Pilgrims' Porch", "The Silent Door"]
chamber = ["Reliquary Cell", "Vestry", "Ossuary Niche", "Censer Room", "Chantry", "Undercroft", "Scriptorium", "Lamp Room"]
hall = ["Nave of Ash", "Hall of the Hushed", "Bone Colonnade", "Processional", "Choir of Dust", "Cloister Walk"]
arena = ["The Hollow Choir", "Sepulchre of the Guardian", "Abbots' Chapter"]
pit = ["Collapsed Ossuary"]
side = ["Burial Cell", "Sealed Tomb", "Sarcophagus Niche", "Forgotten Vault", "Bone Cell"]
overlook = ["Bell Gallery", "Choir Loft"]
bend = ["Narrow Stair", "Cramped Passage", "Bone Gate", "Crypt Turn", "Low Arch"]
vault = ["Offertory", "Sealed Treasury", "Reliquary Vault"]
vista = ["Chapel of the Mourner", "Hall of Effigies", "Ossuary Shrine"]

[components]
cell = 32.0                  # rooms close together: a building, not a cave
corridor_width = [3.5, 4.5]  # narrow passages
passage_width = [3.0, 3.5]
chasm = "void"               # collapsed floors, nothing below
corner_decor = false         # no rock outside the walls: cut stone

[components.rooms.entrance]
size = [6.5, 7.0]
aspect = [1.3, 1.5]          # a long gate hall

[components.rooms.chamber]
size = [6.5, 7.5]

[components.rooms.hall]
# Naves: long, with two rows of solid pillars.
size = [8.5, 9.0]
aspect = [1.2, 1.3]
shape = "pillars"
pillars = { size = 1.8, spacing = 6.5 }

[components.rooms.arena]
# Enclosed boss chambers with four pillars for cover.
size = [11.0, 11.5]
shape = "pillars"
pillars = { size = 2.0, spacing = 7.5 }

[components.rooms.pit]
size = [9.0, 9.5]
shape = "pit"
pit = [3.0, 3.5]

[components.rooms.side]
size = [5.5, 6.5]            # small burial cells

[components.rooms.overlook]
size = [5.0, 5.0]

[components.rooms.bend]
size = [4.0, 4.0]

# 0.9: a small sealed treasury, and a landmark chapel whose single plinth
# holds the mourner effigy.
[components.rooms.vault]
size = [4.5, 5.0]

[components.rooms.vista]
size = [7.0, 7.5]
shape = "pillars"
pillars = { size = 2.4, spacing = 30.0 }

# ------------------------------------------------------------------ recipes --

[recipes.warden_screen]
name = "Warden's Screen"
tests = "a shield wall guarding two healer-acolytes: get past the frontal to interrupt the heals"
room = "hall"
tags = ["protect_caster", "interrupts", "frontal"]
formation = "screen"
placement = "guard_exit"
space = { ranged_lane = true }
mobs = [
  { template = "warden", place = "front" },
  { template = "acolyte", place = "back", count = 2 },
]

[recipes.bone_archers]
name = "Bone Archers"
tests = "archers shooting from range across a pillared nave: pull them round a pillar (line of sight) so they come to you"
room = "hall"
tags = ["line_of_sight"]
formation = "line"
placement = "far"
space = { pillars = true }
mobs = [
  { template = "crawler", place = "front" },
  { template = "archer", place = "back", count = 3 },
]

[recipes.sentinel_patrol]
name = "Sentinel Patrol"
tests = "two halberd sentinels pacing the nave: time the pull or fight them where they turn"
room = "hall"
tags = ["patrol", "frontal"]
placement = "patrol"
patrol = { length = 14.0 }
mobs = [
  { template = "sentinel", place = "front", count = 2 },
]

[recipes.censer_procession]
name = "Censer Procession"
tests = "incense clouds land under the party while acolytes chant: keep moving, interrupt"
room = "hall"
tags = ["area_control", "interrupts"]
formation = "wedge"
placement = "center"
mobs = [
  { template = "censer", place = "front" },
  { template = "acolyte", place = "back" },
  { template = "crawler", place = "flank", count = 2 },
]

[recipes.crawler_rush]
name = "Crawler Nest"
tests = "a fast swarm: the tank gathers them, everyone else stays close to the healer"
room = "chamber"
tags = []
formation = "ring"
placement = "far"
mobs = [
  { template = "crawler", count = 4 },
]

[recipes.sealed_revenant]
name = "Sealed Revenant"
tests = "an optional tomb-guard with a frontal and rot pools, in a tiny cell"
room = "chamber"
tags = ["frontal", "area_control"]
placement = "center"
mobs = [
  { template = "revenant", place = "center" },
]

[recipes.twin_abbots]
name = "The Twin Abbots"
tests = "a council: one abbot heals the other, the other chants party-wide dirges; split interrupts, choose a kill order"
room = "arena"
tags = ["council", "interrupts", "multi_phase"]
formation = "ring"
placement = "center"
mobs = [
  { template = "abbot_vael", place = "center" },
  { template = "abbot_mire", place = "center" },
]

[recipes.hollow_guardian]
name = "The Hollow Guardian"
tests = "a multi-phase guardian: break line of sight behind the pillars when it wails, dodge falling stones, kill the bone shards"
room = "arena"
tags = ["line_of_sight", "multi_phase", "summons", "area_control", "frontal"]
placement = "center"
space = { pillars = true }
mobs = [
  { template = "guardian", place = "center" },
]

