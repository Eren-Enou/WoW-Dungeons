brightness = 200.0
fog = [0.035, 0.03, 0.03]
fog_start = 12.0
fog_end = 55.0

[atmosphere.arena]      # the guardian's sepulchre: deep, teal-dark
ambient = [0.26, 0.36, 0.38]
brightness = 220.0
fog = [0.02, 0.06, 0.06]
fog_start = 14.0
fog_end = 65.0

# Candle sconces on one face of every pillar, each with a small light.
[[decorate]]
anchor = "pillar_face"
every = 4
prop = { model = "models/kit/crypt_sconce.glb", fallback = "crystal", radius = 0.5, height = 0.7 }
light = { color = [1.0, 0.68, 0.38], intensity = 0.4, range = 8.0, height = 0.3, every = 2 }

# Sconces either side of the doors into rooms.
[[decorate]]
anchor = "door_side"
rooms = ["entrance", "chamber", "hall", "arena", "side", "vault", "vista"]
prop = { model = "models/kit/crypt_sconce.glb", fallback = "crystal", radius = 0.5, height = 0.7 }
light = { color = [1.0, 0.68, 0.38], intensity = 0.35, range = 7.0, height = 0.3, every = 2 }

# And along the walls, sparsely.
[[decorate]]
anchor = "wall"
rooms = ["entrance", "chamber", "hall", "arena", "side"]
every = 2
prop = { model = "models/kit/crypt_sconce.glb", fallback = "crystal", radius = 0.5, height = 0.7 }
light = { color = [1.0, 0.68, 0.38], intensity = 0.3, range = 7.0, height = 0.3, every = 3 }

