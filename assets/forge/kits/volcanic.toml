# ------------------------------------------------------------ presentation --
# 0.8: modular art drawn along the real walls (original GLBs generated by
# scripts/make_prop_models.py; procedural rock where a file is missing),
# lighting presets per room role, and decoration at anchors.

[modules]
wall = { model = "models/kit/basalt_wall.glb", size = [4.0, 5.0, 1.0] }
corner = { model = "models/kit/basalt_corner.glb", size = [1.4, 6.0, 1.4] }
door = { model = "models/kit/forge_arch.glb", size = [5.0, 5.0, 0.95] }

[atmosphere.default]
ambient = [0.5, 0.42, 0.4]
fog = [0.06, 0.035, 0.03]

[atmosphere.entrance]   # cooler ash-grey air at the door
ambient = [0.46, 0.46, 0.52]
brightness = 250.0
fog = [0.05, 0.05, 0.06]
fog_start = 22.0
fog_end = 85.0

[atmosphere.corridor]   # tunnels: darker, closer smoke
ambient = [0.42, 0.33, 0.3]
brightness = 170.0
fog = [0.05, 0.03, 0.025]
fog_start = 12.0
fog_end = 55.0

[atmosphere.passage]
ambient = [0.42, 0.33, 0.3]
brightness = 170.0
fog = [0.05, 0.03, 0.025]
fog_start = 12.0
fog_end = 55.0

[atmosphere.hall]
ambient = [0.55, 0.42, 0.36]
brightness = 230.0
fog = [0.07, 0.04, 0.03]

[atmosphere.arena]      # the furnace: red haze
ambient = [0.6, 0.38, 0.3]
brightness = 240.0
fog = [0.12, 0.045, 0.025]
fog_start = 20.0
fog_end = 80.0

[atmosphere.pit]
ambient = [0.62, 0.38, 0.28]
brightness = 250.0
fog = [0.14, 0.05, 0.02]
fog_start = 14.0
fog_end = 60.0

[atmosphere.bridge]
ambient = [0.6, 0.4, 0.3]
brightness = 220.0
fog = [0.13, 0.05, 0.02]
fog_start = 14.0
fog_end = 60.0

# Braziers in the cut corners of boss arenas (as in 0.6).
[[decorate]]
anchor = "cut_corner"
rooms = ["arena"]
prop = { model = "models/props/forge_brazier.glb", fallback = "crystal", scale = 2.0, radius = 0.9, height = 4.4 }

# Forge lanterns flanking every doorway into a room, every other with a light.
[[decorate]]
anchor = "door_side"
rooms = ["entrance", "chamber", "hall", "arena", "pit", "side"]
prop = { model = "models/kit/forge_lantern.glb", fallback = "crystal", radius = 0.45, height = 0.8 }
light = { color = [1.0, 0.5, 0.18], intensity = 0.45, range = 8.0, every = 2 }

# More lanterns along the walls of the big rooms.
[[decorate]]
anchor = "wall"
rooms = ["hall", "arena", "pit", "entrance"]
every = 2
prop = { model = "models/kit/forge_lantern.glb", fallback = "crystal", radius = 0.45, height = 0.8 }
light = { color = [1.0, 0.5, 0.18], intensity = 0.4, range = 8.0, every = 3 }

# Rock columns outside room corners, poking above the walls.
[[decorate]]
anchor = "outer_corner"
decor = ["stalagmite", "pillar", "boulder", "stalagmite"]
