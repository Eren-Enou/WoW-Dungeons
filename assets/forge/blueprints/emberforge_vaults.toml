# Dungeon Forge blueprint: The Emberforge Vaults (original).
#
# A blueprint says what the dungeon should be like, not where anything is.
# Generate it with:
#   cargo run --release -p dungeon_forge -- generate assets/forge/blueprints/emberforge_vaults.toml
# Different seeds give different room arrangements and routes; every one is
# validated (loader, navigation, structure, encounter space) before it is
# written. Formats: DUNGEON_FORGE_0_6.md and DUNGEON_FORGE_0_7.md.

[blueprint]
id = "emberforge_vaults"
name = "The Emberforge Vaults"
description = "A forge-cult's vaults sunk into the mountain: winding caverns, a lava bridge, a pit-side Forgewarden and Cindermaw, the Furnace Wyrm. Generated by Dungeon Forge."
kit = "volcanic"
level = 3
group_size = 5
seed = 1

# What this dungeon is for. Every listed challenge must be delivered by some
# encounter's recipe tags (checked when generating).
[identity]
summary = "Exploration through hot, winding caverns: a choice of routes, a ledge to drop from, a patrol to time, and fights that change where it is safe to stand."
challenges = ["area_control", "patrol", "frontal", "interrupts", "summons"]

[layout]
extra_rooms = [2, 3]      # empty caverns on the main route (room for a drop that skips no fight)
descents = 2              # two ramps down along the main route
shortcut = "drop"         # a ledge that drops (one way) into a later room
bridges = 1               # one crossing over lava
winding = 0.4             # share of flat corridors that wind or angle
straightness = 0.25       # caverns turn often
passages = 0.25           # some approaches run through extra passage bends

# Main route, in order. The last encounter is the final boss.
[[encounters]]
recipe = "melee_pack"

[[encounters]]
recipe = "hound_patrol"

[[encounters]]
recipe = "guarded_caster"

[[encounters]]
recipe = "forgewarden"

[[encounters]]
recipe = "frontal_pack"

[[encounters]]
recipe = "final_cindermaw"

[[optional]]
recipe = "optional_elite"

# 0.9: every branch says what it is for (DUNGEON_REMIX_0_9.md).

# A smoke-filled crawl into a guarded hall: reach the pack from the side
# or behind instead of walking into its front. (Placed first: it is the
# hardest to fit.)
[[routes]]
purpose = "flank"

# The short way crosses pulsing magma vents; a longer tunnel goes round.
[[routes]]
purpose = "safe"

# The Obsidian Sentinel guards a strongbox in a side tunnel that rejoins
# the main cavern further on.
[[routes]]
purpose = "detour"
optional = 1
cache = true


# The Anvil Shrine: a landmark cavern off the route.
[[side]]
purpose = "vista"
