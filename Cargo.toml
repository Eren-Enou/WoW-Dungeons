[workspace]
resolver = "3"
members = ["crates/sim", "crates/game", "crates/forge"]
default-members = ["crates/game"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
bevy = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Fast enough dev builds: optimize dependencies (Bevy) but keep our code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
